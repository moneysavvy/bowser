<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-bubble-sent: #007aff;
      --bg-bubble-received: #2c2c2e;
      --text-primary: #f5f5f7;
      --text-secondary: #8e8e93;
      --border: #38383a;
      --online: #34c759;
      --demo: #ff9500;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 85vh;
      max-height: 700px;
      background: var(--bg-secondary);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }
    
    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .chat-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      animation: pulse 2s ease-in-out infinite;
    }
    
    .status-dot.demo {
      background: var(--demo);
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-text {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .message-count {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 12px;
    }
    
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    
    .messages-area::-webkit-scrollbar {
      width: 6px;
    }
    
    .messages-area::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 85%;
    }
    
    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    
    .message-row.received {
      align-self: flex-start;
    }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    
    .message-row.sent .avatar {
      background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
    }
    
    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      max-width: 100%;
    }
    
    .message-row.sent .message-bubble {
      background: var(--bg-bubble-sent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-row.received .message-bubble {
      background: var(--bg-bubble-received);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    
    .message-text {
      word-wrap: break-word;
    }
    
    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    
    .message-row.sent .message-meta {
      justify-content: flex-end;
      color: rgba(255,255,255,0.7);
    }
    
    .username-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 24px;
      flex: 1;
    }
    
    .username-prompt h2 {
      font-size: 24px;
      font-weight: 600;
      text-align: center;
    }
    
    .username-prompt p {
      color: var(--text-secondary);
      font-size: 15px;
    }
    
    .username-input {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input[type="text"]:focus {
      border-color: var(--bg-bubble-sent);
    }
    
    input[type="text"]::placeholder {
      color: var(--text-secondary);
    }
    
    button {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: var(--bg-bubble-sent);
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      opacity: 0.8;
    }
    
    .input-area {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0,0,0,0.2);
    }
    
    .input-area input {
      flex: 1;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header hidden" id="chatHeader">
      <div>
        <div class="chat-title">Real-time Chat</div>
        <div class="status-row">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-text" id="statusText">Connecting...</span>
        </div>
      </div>
      <div class="message-count" id="messageCount">0 messages</div>
    </div>
    
    <div class="username-prompt" id="usernamePrompt">
      <h2>Welcome to Chat</h2>
      <p>Enter your username to get started</p>
      <div class="username-input">
        <input type="text" id="usernameInput" placeholder="Your username" maxlength="32" autocomplete="off">
        <button type="button" id="joinBtn">Join</button>
      </div>
    </div>
    
    <div class="messages-area hidden" id="messagesArea"></div>
    
    <div class="input-area hidden" id="inputArea">
      <input type="text" id="messageInput" placeholder="Type a message..." maxlength="1000" autocomplete="off">
      <button type="button" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    (function() {
      const SUPABASE_URL = 'https://aayokobrxxndsrcsmzcg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFheW9rb2JyeHhuZHNyY3NtemNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NjM0MDksImV4cCI6MjA2MzMzOTQwOX0.mtBmXPjkFgGjvDqp2B-l-deNoNtv75sSZQVq9ELjzL4';

      let supabase = null;
      let username = null;
      let demoMode = false;
      let messages = [];
      let realtimeChannel = null;

      const usernamePrompt = document.getElementById('usernamePrompt');
      const chatHeader = document.getElementById('chatHeader');
      const messagesArea = document.getElementById('messagesArea');
      const inputArea = document.getElementById('inputArea');
      const usernameInput = document.getElementById('usernameInput');
      const joinBtn = document.getElementById('joinBtn');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const messageCountEl = document.getElementById('messageCount');

      function initSupabase() {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          return true;
        } catch (e) {
          console.warn('Supabase init failed:', e);
          return false;
        }
      }

      async function setupRealtime() {
        if (!supabase) return;
        try {
          const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
          if (error) throw error;
          messages = data || [];
          renderMessages();
          updateMessageCount();

          realtimeChannel = supabase
            .channel('messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
              messages.push(payload.new);
              renderMessages();
              updateMessageCount();
              scrollToBottom();
            })
            .subscribe((status) => {
              if (status === 'SUBSCRIBED') {
                setStatus(true, 'Connected');
              }
            });
        } catch (e) {
          console.warn('Supabase setup failed, using demo mode:', e);
          enableDemoMode();
        }
      }

      function enableDemoMode() {
        demoMode = true;
        messages = [
          { id: 'd1', username: 'System', message: 'Welcome! Supabase tables not configured. Running in demo mode.', created_at: new Date().toISOString() },
          { id: 'd2', username: 'Demo', message: 'Try sending a message — it will appear here (demo only).', created_at: new Date().toISOString() }
        ];
        setStatus(true, 'Demo mode');
        statusDot.classList.add('demo');
        renderMessages();
        updateMessageCount();
      }

      function setStatus(online, text) {
        statusText.textContent = text;
      }

      function renderMessages() {
        messagesArea.innerHTML = '';
        messages.forEach((msg) => {
          const row = document.createElement('div');
          row.className = 'message-row ' + (msg.username === username ? 'sent' : 'received');
          const initial = (msg.username || '?').charAt(0).toUpperCase();
          row.innerHTML = `
            <div class="avatar">${initial}</div>
            <div class="message-bubble">
              <div class="message-text">${escapeHtml(msg.message)}</div>
              <div class="message-meta">
                <span class="msg-username">${escapeHtml(msg.username)}</span>
                <span class="msg-time">${formatTime(msg.created_at)}</span>
              </div>
            </div>
          `;
          messagesArea.appendChild(row);
        });
        scrollToBottom();
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const diff = now - d;
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
        if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString();
      }

      function scrollToBottom() {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function updateMessageCount() {
        messageCountEl.textContent = messages.length + ' message' + (messages.length !== 1 ? 's' : '');
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !username) return;

        if (demoMode) {
          messages.push({
            id: 'd' + Date.now(),
            username,
            message: text,
            created_at: new Date().toISOString()
          });
          renderMessages();
          updateMessageCount();
          messageInput.value = '';
          scrollToBottom();
          return;
        }

        try {
          const { error } = await supabase.from('messages').insert({ username, message: text });
          if (error) throw error;
          messageInput.value = '';
        } catch (e) {
          console.warn('Send failed, switching to demo:', e);
          enableDemoMode();
          sendMessage();
        }
      }

      function joinChat() {
        const name = usernameInput.value.trim();
        if (!name) return;
        username = name;
        usernamePrompt.classList.add('hidden');
        chatHeader.classList.remove('hidden');
        messagesArea.classList.remove('hidden');
        inputArea.classList.remove('hidden');
        messageInput.focus();
        if (supabase && !demoMode) {
          setStatus(false, 'Connecting...');
          setupRealtime();
        } else if (demoMode) {
          renderMessages();
          updateMessageCount();
        }
      }

      joinBtn.addEventListener('click', joinChat);
      usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinChat(); });
      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

      if (initSupabase()) {
        setStatus(false, 'Connecting...');
      } else {
        enableDemoMode();
      }
    })();
  </script>
</body>
</html>
