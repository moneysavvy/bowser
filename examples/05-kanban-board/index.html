<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0f0f12;
      --bg-column: rgba(255, 255, 255, 0.03);
      --bg-card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --warning: #eab308;
      --priority-low: #22c55e;
      --priority-medium: #eab308;
      --priority-high: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: var(--bg-base);
      color: var(--text-primary);
      padding: 1.5rem 2rem;
      background-image: radial-gradient(ellipse 100% 60% at 50% -20%, rgba(99, 102, 241, 0.12), transparent);
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .storage-badge {
      padding: 0.35rem 0.75rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #a5b4fc;
    }

    .add-card-btn {
      padding: 0.6rem 1.25rem;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .add-card-btn:hover {
      background: linear-gradient(135deg, var(--accent-hover), #6366f1);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .board {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      min-height: calc(100vh - 120px);
    }

    .board::-webkit-scrollbar {
      height: 8px;
    }

    .board::-webkit-scrollbar-track {
      background: var(--border);
      border-radius: 4px;
    }

    .board::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 4px;
    }

    .column {
      flex: 0 0 280px;
      min-width: 280px;
      background: var(--bg-column);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 140px);
      transition: var(--transition);
    }

    .column.drag-over {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
      box-shadow: inset 0 0 0 2px var(--accent-glow);
    }

    .column-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .column-count {
      padding: 0.2rem 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .column-cards {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 60px;
    }

    .column-cards::-webkit-scrollbar {
      width: 6px;
    }

    .column-cards::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
      cursor: grab;
      transition: var(--transition);
      animation: cardSlideIn 0.25s ease-out;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow);
    }

    .card.dragging {
      opacity: 0.5;
      cursor: grabbing;
      transform: rotate(2deg);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      flex: 1;
      word-break: break-word;
    }

    .card-delete {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      opacity: 0.6;
      transition: var(--transition);
    }

    .card:hover .card-delete {
      opacity: 1;
    }

    .card-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .card-description {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 0.75rem;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .priority-tag {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-tag.low { background: rgba(34, 197, 94, 0.2); color: var(--priority-low); }
    .priority-tag.medium { background: rgba(234, 179, 8, 0.2); color: var(--priority-medium); }
    .priority-tag.high { background: rgba(239, 68, 68, 0.2); color: var(--priority-high); }

    .card-timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #1a1a1f;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: var(--transition);
    }

    .modal-overlay.open .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .modal-actions button {
      flex: 1;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-hover), #6366f1);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://aayokobrxxndsrcsmzcg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFheW9rb2JyeHhuZHNyY3NtemNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NjM0MDksImV4cCI6MjA2MzMzOTQwOX0.mtBmXPjkFgGjvDqp2B-l-deNoNtv75sSZQVq9ELjzL4';
      const STORAGE_KEY = 'kanban-cards';
      const COLUMNS = ['Backlog', 'In Progress', 'Review', 'Done'];

      const DEMO_CARDS = [
        { id: 'd1', title: 'Design system audit', description: 'Review and document component inconsistencies', priority: 'High', column: 'Backlog', created_at: new Date().toISOString(), position: 0 },
        { id: 'd2', title: 'API integration', description: 'Connect frontend to new REST endpoints', priority: 'High', column: 'Backlog', created_at: new Date().toISOString(), position: 1 },
        { id: 'd3', title: 'User auth flow', description: 'Implement login and signup screens', priority: 'Medium', column: 'In Progress', created_at: new Date().toISOString(), position: 0 },
        { id: 'd4', title: 'Database migrations', description: 'Run and verify schema updates', priority: 'Medium', column: 'In Progress', created_at: new Date().toISOString(), position: 1 },
        { id: 'd5', title: 'Performance review', description: 'Profile and optimize slow queries', priority: 'Low', column: 'Review', created_at: new Date().toISOString(), position: 0 },
        { id: 'd6', title: 'Accessibility audit', description: 'WCAG compliance check', priority: 'Low', column: 'Review', created_at: new Date().toISOString(), position: 1 },
        { id: 'd7', title: 'Deploy v1.0', description: 'Production release', priority: 'High', column: 'Done', created_at: new Date().toISOString(), position: 0 },
        { id: 'd8', title: 'Documentation', description: 'Update README and API docs', priority: 'Low', column: 'Done', created_at: new Date().toISOString(), position: 1 }
      ];

      let supabase = null;
      let useSupabase = false;

      async function initSupabase() {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data, error } = await supabase.from('kanban_cards').select('id').limit(1);
          if (error) throw error;
          useSupabase = true;
          return true;
        } catch (e) {
          useSupabase = false;
          return false;
        }
      }

      async function fetchCards() {
        if (useSupabase && supabase) {
          try {
            const { data, error } = await supabase.from('kanban_cards').select('*').order('position', { ascending: true }).order('created_at', { ascending: true });
            if (error) throw error;
            const cards = data || [];
            if (cards.length === 0) {
              const seeded = await seedDemoCards();
              return seeded;
            }
            return cards;
          } catch (e) {
            useSupabase = false;
            return getFromStorage();
          }
        }
        return getFromStorage();
      }

      function getFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const cards = raw ? JSON.parse(raw) : [];
          if (cards.length === 0) {
            const demo = DEMO_CARDS.map(c => ({ ...c, id: crypto.randomUUID() }));
            saveToStorage(demo);
            return demo;
          }
          return cards;
        } catch {
          return DEMO_CARDS.map(c => ({ ...c, id: crypto.randomUUID() }));
        }
      }

      function saveToStorage(cards) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        } catch (e) {}
      }

      async function seedDemoCards() {
        const cards = DEMO_CARDS.map((c, i) => ({
          id: crypto.randomUUID(),
          title: c.title,
          description: c.description,
          priority: c.priority,
          column: c.column,
          created_at: new Date().toISOString(),
          position: i
        }));
        if (useSupabase && supabase) {
          try {
            const { error } = await supabase.from('kanban_cards').insert(cards);
            if (error) throw error;
            return cards;
          } catch (e) {
            useSupabase = false;
          }
        }
        saveToStorage(cards);
        return cards;
      }

      async function addCard(card) {
        const newCard = {
          id: crypto.randomUUID(),
          title: card.title.trim(),
          description: (card.description || '').trim(),
          priority: card.priority || 'Medium',
          column: 'Backlog',
          created_at: new Date().toISOString(),
          position: 0
        };

        if (useSupabase && supabase) {
          try {
            const { error } = await supabase.from('kanban_cards').insert([newCard]);
            if (error) throw error;
            return newCard;
          } catch (e) {
            useSupabase = false;
          }
        }

        const cards = getFromStorage();
        const backlogCards = cards.filter(c => c.column === 'Backlog');
        newCard.position = backlogCards.length;
        cards.push(newCard);
        saveToStorage(cards);
        return newCard;
      }

      async function updateCard(id, updates) {
        if (useSupabase && supabase) {
          try {
            const { error } = await supabase.from('kanban_cards').update(updates).eq('id', id);
            if (error) throw error;
            return;
          } catch (e) {
            useSupabase = false;
          }
        }

        const cards = getFromStorage();
        const idx = cards.findIndex(c => c.id === id);
        if (idx === -1) return;
        cards[idx] = { ...cards[idx], ...updates };
        saveToStorage(cards);
      }

      async function deleteCard(id) {
        if (useSupabase && supabase) {
          try {
            const { error } = await supabase.from('kanban_cards').delete().eq('id', id);
            if (error) throw error;
            return;
          } catch (e) {
            useSupabase = false;
          }
        }

        const cards = getFromStorage().filter(c => c.id !== id);
        saveToStorage(cards);
      }

      async function moveCard(id, targetColumn, targetPosition) {
        const cards = getFromStorage();
        const card = cards.find(c => c.id === id);
        if (!card) return;

        const updates = { column: targetColumn, position: targetPosition };
        if (useSupabase && supabase) {
          try {
            const { error } = await supabase.from('kanban_cards').update(updates).eq('id', id);
            if (error) throw error;
            return;
          } catch (e) {
            useSupabase = false;
          }
        }

        card.column = targetColumn;
        card.position = targetPosition;
        saveToStorage(cards);
      }

      let state = { cards: [] };

      function setState(updates) {
        state = { ...state, ...updates };
        render();
      }

      function escapeHtml(s) {
        if (!s) return '';
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function formatDate(iso) {
        try {
          const d = new Date(iso);
          const now = new Date();
          const diff = now - d;
          if (diff < 60000) return 'Just now';
          if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
          if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
          return d.toLocaleDateString();
        } catch {
          return '';
        }
      }

      function getCardsByColumn() {
        const byCol = {};
        COLUMNS.forEach(c => { byCol[c] = []; });
        state.cards
          .sort((a, b) => (a.position ?? 0) - (b.position ?? 0) || new Date(a.created_at) - new Date(b.created_at))
          .forEach(c => {
            if (byCol[c.column]) byCol[c.column].push(c);
          });
        return byCol;
      }

      let draggedCard = null;
      let dragOverColumn = null;

      function render() {
        const app = document.getElementById('app');
        const storageMode = useSupabase ? 'Supabase' : 'localStorage';
        const byCol = getCardsByColumn();

        app.innerHTML = `
          <div class="header">
            <h1>Kanban Board</h1>
            <div class="header-actions">
              <span class="storage-badge">${storageMode}</span>
              <button class="add-card-btn" id="addCardBtn">+ Add Card</button>
            </div>
          </div>
          <div class="board" id="board">
            ${COLUMNS.map(col => `
              <div class="column ${dragOverColumn === col ? 'drag-over' : ''}" data-column="${col}" data-drop-zone>
                <div class="column-header">
                  <span class="column-title">${escapeHtml(col)}</span>
                  <span class="column-count">${byCol[col].length}</span>
                </div>
                <div class="column-cards" data-column="${col}">
                  ${byCol[col].map(c => `
                    <div class="card" data-id="${c.id}" draggable="true">
                      <div class="card-header">
                        <span class="card-title">${escapeHtml(c.title)}</span>
                        <button class="card-delete" data-action="delete" aria-label="Delete">×</button>
                      </div>
                      ${c.description ? `<div class="card-description">${escapeHtml(c.description)}</div>` : ''}
                      <div class="card-footer">
                        <span class="priority-tag ${(c.priority || 'medium').toLowerCase()}">${escapeHtml(c.priority || 'Medium')}</span>
                        <span class="card-timestamp">${formatDate(c.created_at)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;

        document.getElementById('addCardBtn').addEventListener('click', openAddModal);

        const cards = app.querySelectorAll('.card');
        cards.forEach(cardEl => {
          const id = cardEl.dataset.id;
          cardEl.addEventListener('dragstart', handleDragStart);
          cardEl.addEventListener('dragend', handleDragEnd);
          cardEl.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteCard(id).then(() => fetchCards().then(cards => setState({ cards })));
          });
        });

        const columns = app.querySelectorAll('[data-drop-zone]');
        columns.forEach(colEl => {
          colEl.addEventListener('dragover', handleDragOver);
          colEl.addEventListener('dragleave', handleDragLeave);
          colEl.addEventListener('drop', handleDrop);
        });
      }

      function handleDragStart(e) {
        draggedCard = e.target.closest('.card');
        if (!draggedCard) return;
        draggedCard.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedCard.dataset.id);
        e.dataTransfer.setData('application/json', JSON.stringify({ id: draggedCard.dataset.id }));
      }

      function handleDragEnd(e) {
        if (draggedCard) draggedCard.classList.remove('dragging');
        draggedCard = null;
        dragOverColumn = null;
        setState({});
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const col = e.currentTarget.dataset.column;
        if (col) {
          dragOverColumn = col;
          setState({});
        }
      }

      function handleDragLeave(e) {
        if (!e.currentTarget.contains(e.relatedTarget)) {
          dragOverColumn = null;
          setState({});
        }
      }

      function handleDrop(e) {
        e.preventDefault();
        const col = e.currentTarget.closest('.column')?.dataset.column;
        const id = e.dataTransfer.getData('text/plain');
        if (!col || !id) return;

        const card = state.cards.find(c => c.id === id);
        if (!card || card.column === col) return;

        const byCol = getCardsByColumn();
        const targetCards = byCol[col];
        const targetPosition = targetCards.length;

        moveCard(id, col, targetPosition).then(() => {
          fetchCards().then(cards => setState({ cards }));
        });
        dragOverColumn = null;
      }

      function openAddModal() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay open';
        overlay.id = 'addModal';
        overlay.innerHTML = `
          <div class="modal">
            <h2>Add Card</h2>
            <form id="addCardForm">
              <div class="form-group">
                <label for="cardTitle">Title</label>
                <input type="text" id="cardTitle" placeholder="Card title" required autocomplete="off" />
              </div>
              <div class="form-group">
                <label for="cardDesc">Description</label>
                <textarea id="cardDesc" placeholder="Card description"></textarea>
              </div>
              <div class="form-group">
                <label for="cardPriority">Priority</label>
                <select id="cardPriority">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
              <div class="modal-actions">
                <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-primary">Add Card</button>
              </div>
            </form>
          </div>
        `;

        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeModal();
        });

        document.body.appendChild(overlay);

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('addCardForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('cardTitle').value.trim();
          const description = document.getElementById('cardDesc').value.trim();
          const priority = document.getElementById('cardPriority').value;
          if (!title) return;
          addCard({ title, description, priority }).then(() => {
            closeModal();
            fetchCards().then(cards => setState({ cards }));
          });
        });

        function closeModal() {
          overlay.remove();
        }
      }

      async function init() {
        await initSupabase();
        const cards = await fetchCards();
        setState({ cards });
      }

      init();
    })();
  </script>
</body>
</html>
