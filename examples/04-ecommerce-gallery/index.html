<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Product Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --accent: #c17f59;
      --accent-hover: #a86a47;
      --accent-light: rgba(193, 127, 89, 0.12);
      --border: #e8e4df;
      --star: #e4a853;
      --danger: #c94a4a;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--text);
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      transition: var(--transition);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .search-box {
      position: relative;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .cart-trigger {
      position: relative;
      padding: 0.6rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-trigger:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: var(--text);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-hidden {
      display: none;
    }

    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .toolbar-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-hover);
      font-weight: 600;
    }

    .sort-select {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
    }

    .sort-select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow);
      animation: cardIn 0.4s ease-out both;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: transparent;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-img-wrap {
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--bg);
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .product-card:hover .product-img {
      transform: scale(1.03);
    }

    .product-body {
      padding: 1.25rem;
    }

    .product-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .stars {
      color: var(--star);
      font-size: 0.9rem;
    }

    .rating-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .add-cart-btn {
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .add-cart-btn:hover {
      background: var(--accent-hover);
    }

    .add-cart-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--bg-card);
      box-shadow: -8px 0 40px rgba(0, 0, 0, 0.15);
      z-index: 201;
      transform: translateX(100%);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .cart-overlay.open .cart-panel {
      transform: translateX(0);
    }

    .cart-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .cart-close {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .cart-close:hover {
      background: var(--accent-light);
      color: var(--text);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .cart-item-remove {
      padding: 0.35rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
      align-self: flex-start;
    }

    .cart-item-remove:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .cart-empty {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .storage-badge {
      position: absolute;
      top: 0.5rem;
      right: 8rem;
      padding: 0.2rem 0.6rem;
      background: var(--accent-light);
      border-radius: 999px;
      font-size: 0.7rem;
      color: var(--accent-hover);
    }

    @media (max-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }

      .product-body {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo">Shop</a>
      <div class="search-wrap">
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="Search products..." autocomplete="off" />
        </div>
      </div>
      <button class="cart-trigger" id="cartTrigger" aria-label="Open cart">
        Cart <span class="cart-badge badge-hidden" id="cartBadge">0</span>
      </button>
      <span class="storage-badge" id="storageBadge" style="display:none">Supabase</span>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <span class="toolbar-label">Category:</span>
      <div class="filters" id="categoryFilters"></div>
      <span class="toolbar-label" style="margin-left: auto">Sort:</span>
      <select class="sort-select" id="sortSelect">
        <option value="default">Default</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Rating</option>
      </select>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <div class="cart-header">
        <h2 class="cart-title">Your Cart</h2>
        <button class="cart-close" id="cartClose" aria-label="Close cart">×</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://aayokobrxxndsrcsmzcg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFheW9rb2JyeHhuZHNyY3NtemNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NjM0MDksImV4cCI6MjA2MzMzOTQwOX0.mtBmXPjkFgGjvDqp2B-l-deNoNtv75sSZQVq9ELjzL4';
      const CART_KEY = 'ecommerce-gallery-cart';

      const DEMO_PRODUCTS = [
        { id: '1', name: 'Wireless Bluetooth Headphones', price: 89.99, rating: 4.5, category: 'Electronics', imageSeed: 1 },
        { id: '2', name: 'Organic Cotton T-Shirt', price: 34.99, rating: 4.5, category: 'Clothing', imageSeed: 2 },
        { id: '3', name: 'Ceramic Coffee Maker', price: 129.99, rating: 4.8, category: 'Home', imageSeed: 3 },
        { id: '4', name: 'Running Shoes Pro', price: 149.99, rating: 4.6, category: 'Sports', imageSeed: 4 },
        { id: '5', name: 'Smart Watch Pro', price: 249.99, rating: 4.7, category: 'Electronics', imageSeed: 5 },
        { id: '6', name: 'Wireless Mouse', price: 49.99, rating: 4.4, category: 'Electronics', imageSeed: 6 },
        { id: '7', name: 'Premium Wool Sweater', price: 79.99, rating: 4.5, category: 'Clothing', imageSeed: 7 },
        { id: '8', name: 'Linen Throw Blanket', price: 59.99, rating: 4.5, category: 'Home', imageSeed: 8 },
        { id: '9', name: 'Yoga Mat Premium', price: 39.99, rating: 4.6, category: 'Sports', imageSeed: 9 },
        { id: '10', name: 'Desk Lamp LED', price: 44.99, rating: 4.3, category: 'Home', imageSeed: 10 },
        { id: '11', name: 'Wireless Keyboard', price: 69.99, rating: 4.5, category: 'Electronics', imageSeed: 11 },
        { id: '12', name: 'Fitness Tracker Band', price: 54.99, rating: 4.5, category: 'Sports', imageSeed: 12 }
      ];

      const CATEGORIES = ['All', 'Electronics', 'Clothing', 'Home', 'Sports'];

      let supabase = null;
      let useSupabase = false;

      async function initSupabase() {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data, error } = await supabase.from('products').select('*').limit(1);
          if (error) throw error;
          useSupabase = true;
          return true;
        } catch (e) {
          useSupabase = false;
          return false;
        }
      }

      async function fetchProducts() {
        if (useSupabase && supabase) {
          try {
            const { data, error } = await supabase.from('products').select('*');
            if (error) throw error;
            if (data && data.length > 0) {
              return data.map(p => ({
                id: String(p.id),
                name: p.name || 'Product',
                price: parseFloat(p.price) || 0,
                rating: parseFloat(p.rating) || 4,
                category: p.category || 'Home',
                imageSeed: p.image_seed || p.id
              }));
            }
          } catch (e) {
            useSupabase = false;
          }
        }
        return DEMO_PRODUCTS;
      }

      function getCart() {
        try {
          const raw = localStorage.getItem(CART_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function saveCart(cart) {
        try {
          localStorage.setItem(CART_KEY, JSON.stringify(cart));
        } catch (e) {}
      }

      function getImageUrl(seed) {
        return `https://picsum.photos/300/300?random=${seed}`;
      }

      function renderStars(rating) {
        const full = Math.floor(rating);
        const half = rating % 1 >= 0.5 ? 1 : 0;
        const empty = 5 - full - half;
        return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      let state = {
        products: [],
        search: '',
        category: 'All',
        sort: 'default',
        cart: []
      };

      function setState(updates) {
        state = { ...state, ...updates };
        render();
      }

      function getFilteredProducts() {
        let list = [...state.products];
        const q = state.search.toLowerCase().trim();
        if (q) {
          list = list.filter(p => p.name.toLowerCase().includes(q));
        }
        if (state.category !== 'All') {
          list = list.filter(p => p.category === state.category);
        }
        if (state.sort === 'price-low') list.sort((a, b) => a.price - b.price);
        else if (state.sort === 'price-high') list.sort((a, b) => b.price - a.price);
        else if (state.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
        return list;
      }

      function addToCart(product) {
        const cart = getCart();
        const existing = cart.find(c => c.id === product.id);
        if (existing) {
          existing.qty = (existing.qty || 1) + 1;
        } else {
          cart.push({ ...product, qty: 1 });
        }
        saveCart(cart);
        setState({ cart });
      }

      function removeFromCart(productId) {
        const cart = getCart().filter(c => c.id !== productId);
        saveCart(cart);
        setState({ cart });
      }

      function getCartCount() {
        return getCart().reduce((sum, c) => sum + (c.qty || 1), 0);
      }

      function render() {
        const filtered = getFilteredProducts();
        const cart = getCart();
        const cartCount = getCartCount();

        document.getElementById('storageBadge').style.display = useSupabase ? 'block' : 'none';

        const badgeEl = document.getElementById('cartBadge');
        badgeEl.textContent = cartCount;
        badgeEl.classList.toggle('badge-hidden', cartCount === 0);

        document.getElementById('categoryFilters').innerHTML = CATEGORIES.map(cat => `
          <button class="filter-btn ${state.category === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
        `).join('');

        document.getElementById('productGrid').innerHTML = filtered.length === 0
          ? '<div class="empty-state"><div class="empty-state-icon">📦</div><div>No products match your filters.</div></div>'
          : filtered.map((p, i) => `
            <article class="product-card" data-id="${p.id}" style="animation-delay: ${i * 0.04}s">
              <div class="product-img-wrap">
                <img src="${getImageUrl(p.imageSeed)}" alt="${escapeHtml(p.name)}" class="product-img" loading="lazy" />
              </div>
              <div class="product-body">
                <div class="product-category">${escapeHtml(p.category)}</div>
                <h3 class="product-name">${escapeHtml(p.name)}</h3>
                <div class="product-rating">
                  <span class="stars">${renderStars(p.rating)}</span>
                  <span class="rating-text">${p.rating}</span>
                </div>
                <div class="product-footer">
                  <span class="product-price">$${p.price.toFixed(2)}</span>
                  <button class="add-cart-btn" data-add="${p.id}">Add to Cart</button>
                </div>
              </div>
            </article>
          `).join('');

        document.getElementById('cartItems').innerHTML = cart.length === 0
          ? '<div class="cart-empty">Your cart is empty.</div>'
          : cart.map(c => `
            <div class="cart-item" data-id="${c.id}">
              <img src="${getImageUrl(c.imageSeed)}" alt="${escapeHtml(c.name)}" class="cart-item-img" />
              <div class="cart-item-info">
                <div class="cart-item-name">${escapeHtml(c.name)}</div>
                <div class="cart-item-price">${(c.qty || 1) > 1 ? (c.qty || 1) + ' × $' + c.price.toFixed(2) + ' = ' : ''}$${(c.price * (c.qty || 1)).toFixed(2)}</div>
              </div>
              <button class="cart-item-remove" data-remove="${c.id}">Remove</button>
            </div>
          `).join('');

        document.getElementById('sortSelect').value = state.sort;

        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => setState({ category: btn.dataset.category }));
        });

        document.getElementById('sortSelect').addEventListener('change', e => {
          setState({ sort: e.target.value });
        });

        document.querySelectorAll('.add-cart-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const prod = state.products.find(p => p.id === btn.dataset.add);
            if (prod) addToCart(prod);
          });
        });

        document.querySelectorAll('.cart-item-remove').forEach(btn => {
          btn.addEventListener('click', () => removeFromCart(btn.dataset.remove));
        });
      }

      document.getElementById('searchInput').addEventListener('input', e => {
        setState({ search: e.target.value });
      });

      document.getElementById('cartTrigger').addEventListener('click', () => {
        document.getElementById('cartOverlay').classList.add('open');
      });

      document.getElementById('cartClose').addEventListener('click', () => {
        document.getElementById('cartOverlay').classList.remove('open');
      });

      document.getElementById('cartOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) {
          document.getElementById('cartOverlay').classList.remove('open');
        }
      });

      async function init() {
        await initSupabase();
        const products = await fetchProducts();
        setState({ products, cart: getCart() });
      }

      init();
    })();
  </script>
</body>
</html>
