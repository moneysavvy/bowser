<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Explorer & Validator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 24px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: #f8fafc;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #f8fafc;
      resize: vertical;
    }
    textarea::placeholder {
      color: #64748b;
    }
    textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      font-family: 'DM Sans', sans-serif;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    .btn-primary:hover {
      background: #5558e3;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .validation-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 12px;
    }
    .validation-valid {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
    .validation-invalid {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .validation-pending {
      background: rgba(100, 116, 139, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #64748b;
    }
    .search-bar {
      width: 100%;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #f8fafc;
      margin-bottom: 16px;
    }
    .search-bar::placeholder {
      color: #64748b;
    }
    .search-bar:focus {
      outline: none;
      border-color: #6366f1;
    }
    .tree-container {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 500px;
      overflow-y: auto;
    }
    .tree-node {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .tree-node:hover {
      background: rgba(99, 102, 241, 0.15);
    }
    .tree-node.highlight {
      background: rgba(99, 102, 241, 0.25);
    }
    .tree-children {
      margin-left: 20px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding-left: 12px;
    }
    .tree-toggle {
      display: inline-block;
      width: 16px;
      text-align: center;
      color: #94a3b8;
      transition: transform 0.2s;
    }
    .tree-toggle.expanded {
      transform: rotate(90deg);
    }
    .tree-key {
      color: #f8fafc;
    }
    .tree-value-string { color: #22c55e; }
    .tree-value-number { color: #6366f1; }
    .tree-value-boolean { color: #f59e0b; }
    .tree-value-null { color: #ef4444; }
    .tree-index {
      color: #94a3b8;
      font-weight: 500;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .stat-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #6366f1;
    }
    .stat-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      background: rgba(34, 197, 94, 0.95);
      color: white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      animation: toastIn 0.3s ease;
    }
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .empty-state {
      color: #64748b;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JSON Explorer & Validator</h1>

    <div class="card input-section">
      <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>
      <div class="button-row">
        <button class="btn-primary" id="parseBtn">Parse</button>
        <button class="btn-secondary" id="formatBtn">Format</button>
        <button class="btn-secondary" id="minifyBtn">Minify</button>
      </div>
      <div id="validationStatus" class="validation-status validation-pending">
        <span id="validationIcon">○</span>
        <span id="validationMessage">Paste JSON and click Parse to validate</span>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search keys or values...">
        <div id="treeContainer" class="tree-container">
          <div class="empty-state">Parse valid JSON to view tree</div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 1rem; margin-bottom: 12px; color: #f8fafc;">Statistics</h3>
        <div id="statsGrid" class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" id="statKeys">0</div>
            <div class="stat-label">Keys</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statDepth">0</div>
            <div class="stat-label">Depth</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statArrays">0</div>
            <div class="stat-label">Arrays</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statObjects">0</div>
            <div class="stat-label">Objects</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statStrings">0</div>
            <div class="stat-label">Strings</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statNumbers">0</div>
            <div class="stat-label">Numbers</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statBooleans">0</div>
            <div class="stat-label">Booleans</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statNulls">0</div>
            <div class="stat-label">Nulls</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SAMPLE_JSON = {
        "data": {
          "users": [
            {
              "id": 1,
              "name": "Alice Johnson",
              "email": "alice@example.com",
              "active": true,
              "roles": ["admin", "user"],
              "metadata": {
                "created": "2024-01-15",
                "lastLogin": "2024-02-10T14:30:00Z"
              }
            },
            {
              "id": 2,
              "name": "Bob Smith",
              "email": "bob@example.com",
              "active": false,
              "roles": ["user"],
              "metadata": null
            }
          ],
          "config": {
            "theme": "dark",
            "maxRetries": 3,
            "features": {
              "notifications": true,
              "analytics": false
            }
          },
          "stats": {
            "totalUsers": 150,
            "activeSessions": 42,
            "apiCalls": 12500
          }
        }
      };

      const jsonInput = document.getElementById('jsonInput');
      const parseBtn = document.getElementById('parseBtn');
      const formatBtn = document.getElementById('formatBtn');
      const minifyBtn = document.getElementById('minifyBtn');
      const validationStatus = document.getElementById('validationStatus');
      const validationIcon = document.getElementById('validationIcon');
      const validationMessage = document.getElementById('validationMessage');
      const searchInput = document.getElementById('searchInput');
      const treeContainer = document.getElementById('treeContainer');

      let parsedData = null;
      let collapseState = {};
      let searchDebounce = null;

      jsonInput.value = JSON.stringify(SAMPLE_JSON, null, 2);

      function showToast(message) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
      }

      function setValidation(valid, message) {
        validationStatus.className = 'validation-status ' + (valid ? 'validation-valid' : valid === false ? 'validation-invalid' : 'validation-pending');
        validationIcon.textContent = valid ? '✓' : valid === false ? '✕' : '○';
        validationMessage.textContent = message;
      }

      function parseJSON() {
        const raw = jsonInput.value.trim();
        if (!raw) {
          setValidation(null, 'Enter JSON to validate');
          return null;
        }
        try {
          const data = JSON.parse(raw);
          setValidation(true, 'Valid JSON');
          return data;
        } catch (e) {
          const match = e.message.match(/position (\d+)/);
          const pos = match ? parseInt(match[1], 10) : 0;
          const lines = raw.substring(0, pos).split('\n');
          const line = lines.length;
          setValidation(false, `Line ${line}: ${e.message}`);
          return null;
        }
      }

      function collectStats(obj, stats = { keys: 0, depth: 0, arrays: 0, objects: 0, strings: 0, numbers: 0, booleans: 0, nulls: 0 }, depth = 0) {
        stats.depth = Math.max(stats.depth, depth);
        if (Array.isArray(obj)) {
          stats.arrays++;
          obj.forEach((v, i) => {
            stats.keys++;
            if (typeof v === 'object' && v !== null) collectStats(v, stats, depth + 1);
            else if (typeof v === 'string') stats.strings++;
            else if (typeof v === 'number') stats.numbers++;
            else if (typeof v === 'boolean') stats.booleans++;
            else if (v === null) stats.nulls++;
          });
        } else if (obj && typeof obj === 'object') {
          stats.objects++;
          for (const k of Object.keys(obj)) {
            stats.keys++;
            const v = obj[k];
            if (typeof v === 'object' && v !== null) collectStats(v, stats, depth + 1);
            else if (typeof v === 'string') stats.strings++;
            else if (typeof v === 'number') stats.numbers++;
            else if (typeof v === 'boolean') stats.booleans++;
            else if (v === null) stats.nulls++;
          }
        }
        return stats;
      }

      function updateStats(data) {
        const stats = collectStats(data);
        document.getElementById('statKeys').textContent = stats.keys;
        document.getElementById('statDepth').textContent = stats.depth;
        document.getElementById('statArrays').textContent = stats.arrays;
        document.getElementById('statObjects').textContent = stats.objects;
        document.getElementById('statStrings').textContent = stats.strings;
        document.getElementById('statNumbers').textContent = stats.numbers;
        document.getElementById('statBooleans').textContent = stats.booleans;
        document.getElementById('statNulls').textContent = stats.nulls;
      }

      function getNodeId(path) {
        return 'node-' + path.replace(/[\.\[\]]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      }

      function matchesSearch(value, search) {
        if (!search) return true;
        const s = search.toLowerCase();
        const str = String(value).toLowerCase();
        return str.includes(s);
      }

      function renderTree(data, path = '', search = '', depth = 0) {
        const id = getNodeId(path);
        const isCollapsed = collapseState[id] === false ? false : (depth > 0);
        const hasChildren = (Array.isArray(data) && data.length > 0) || (data && typeof data === 'object' && !Array.isArray(data) && Object.keys(data).length > 0);

        if (Array.isArray(data)) {
          const filtered = [];
          for (let i = 0; i < data.length; i++) {
            const item = data[i];
            const itemPath = path ? `${path}[${i}]` : `[${i}]`;
            if (search) {
              const keyMatch = matchesSearch(`[${i}]`, search);
              const valMatch = typeof item === 'object' && item !== null ? JSON.stringify(item).toLowerCase().includes(search.toLowerCase()) : matchesSearch(item, search);
              if (keyMatch || valMatch) filtered.push({ i, item, itemPath });
            } else {
              filtered.push({ i, item, itemPath });
            }
          }
          if (filtered.length === 0 && search) return '';

          let html = '';
          for (const { i, item, itemPath } of filtered) {
            const childId = getNodeId(itemPath);
            const isPrimitive = item === null || typeof item !== 'object';
            const childCollapsed = collapseState[childId] === false ? false : true;
            const childHasChildren = !isPrimitive && ((Array.isArray(item) && item.length > 0) || Object.keys(item).length > 0);

            html += `<div class="tree-node" data-path="${escapeHtml(itemPath)}" data-copy="${escapeHtml(itemPath)}">`;
            if (childHasChildren) {
              html += `<span class="tree-toggle ${childCollapsed ? '' : 'expanded'}" data-toggle="${escapeHtml(childId)}">›</span> `;
            } else {
              html += '<span class="tree-toggle" style="visibility:hidden">›</span> ';
            }
            html += `<span class="tree-index">[${i}]</span> `;
            if (isPrimitive) {
              const cls = item === null ? 'tree-value-null' : typeof item === 'string' ? 'tree-value-string' : typeof item === 'number' ? 'tree-value-number' : 'tree-value-boolean';
              const rawDisplay = item === null ? 'null' : typeof item === 'string' ? `"${String(item).slice(0, 50)}${String(item).length > 50 ? '...' : ''}"` : String(item);
              const display = search ? highlightMatches(rawDisplay, search) : escapeHtml(rawDisplay);
              html += `<span class="${cls}">${display}</span>`;
            } else {
              const preview = Array.isArray(item) ? `Array(${item.length})` : `Object(${Object.keys(item).length})`;
              const previewDisplay = search ? highlightMatches(preview, search) : escapeHtml(preview);
              html += `<span class="tree-value-string">${previewDisplay}</span>`;
              if (!childCollapsed) {
                html += '<div class="tree-children">' + renderTree(item, itemPath, search, depth + 1) + '</div>';
              }
            }
            html += '</div>';
          }
          return html;
        }

        if (data && typeof data === 'object') {
          const entries = Object.entries(data);
          const filtered = search ? entries.filter(([k, v]) => {
            const keyMatch = matchesSearch(k, search);
            const valMatch = typeof v === 'object' && v !== null ? JSON.stringify(v).toLowerCase().includes(search.toLowerCase()) : matchesSearch(v, search);
            return keyMatch || valMatch;
          }) : entries;
          if (filtered.length === 0 && search) return '';

          let html = '';
          for (const [key, value] of filtered) {
            const itemPath = path ? `${path}.${key}` : key;
            const childId = getNodeId(itemPath);
            const isPrimitive = value === null || typeof value !== 'object';
            const childCollapsed = collapseState[childId] === false ? false : true;
            const childHasChildren = !isPrimitive && ((Array.isArray(value) && value.length > 0) || Object.keys(value).length > 0);

            html += `<div class="tree-node" data-path="${escapeHtml(itemPath)}" data-copy="${escapeHtml(itemPath)}">`;
            if (childHasChildren) {
              html += `<span class="tree-toggle ${childCollapsed ? '' : 'expanded'}" data-toggle="${escapeHtml(childId)}">›</span> `;
            } else {
              html += '<span class="tree-toggle" style="visibility:hidden">›</span> ';
            }
            const keyDisplay = search ? highlightMatches(`"${key}"`, search) : `"${escapeHtml(key)}"`;
            html += `<span class="tree-key">${keyDisplay}</span>: `;
            if (isPrimitive) {
              const cls = value === null ? 'tree-value-null' : typeof value === 'string' ? 'tree-value-string' : typeof value === 'number' ? 'tree-value-number' : 'tree-value-boolean';
              const rawDisplay = value === null ? 'null' : typeof value === 'string' ? `"${String(value).slice(0, 50)}${String(value).length > 50 ? '...' : ''}"` : String(value);
              const display = search ? highlightMatches(rawDisplay, search) : escapeHtml(rawDisplay);
              html += `<span class="${cls}">${display}</span>`;
            } else {
              const preview = Array.isArray(value) ? `Array(${value.length})` : `Object(${Object.keys(value).length})`;
              const previewDisplay = search ? highlightMatches(preview, search) : escapeHtml(preview);
              html += `<span class="tree-value-string">${previewDisplay}</span>`;
              if (!childCollapsed) {
                html += '<div class="tree-children">' + renderTree(value, itemPath, search, depth + 1) + '</div>';
              }
            }
            html += '</div>';
          }
          return html;
        }

        return '';
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function highlightMatches(text, search) {
        if (!search) return escapeHtml(text);
        const re = new RegExp(`(${escapeRegex(search)})`, 'gi');
        return escapeHtml(text).replace(re, '<mark style="background:rgba(99,102,241,0.4);color:#f8fafc;padding:0 2px;border-radius:2px;">$1</mark>');
      }

      function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function buildTree(data, search = '') {
        const html = renderTree(data, '', search, 0);
        treeContainer.innerHTML = html || '<div class="empty-state">No matching nodes</div>';
        treeContainer.querySelectorAll('[data-toggle]').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = el.getAttribute('data-toggle');
            collapseState[id] = collapseState[id] === false;
            buildTree(parsedData, searchInput.value.trim());
          });
        });
        treeContainer.querySelectorAll('.tree-node[data-copy]').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.tree-toggle')) return;
            const path = el.getAttribute('data-copy');
            if (path) {
              navigator.clipboard.writeText(path).then(() => {
                showToast('Copied path: ' + path);
              });
            }
          });
        });
      }

      parseBtn.addEventListener('click', () => {
        parsedData = parseJSON();
        if (parsedData) {
          updateStats(parsedData);
          collapseState = {};
          buildTree(parsedData, searchInput.value.trim());
        } else {
          treeContainer.innerHTML = '<div class="empty-state">Fix JSON errors and parse again</div>';
        }
      });

      formatBtn.addEventListener('click', () => {
        const data = parseJSON();
        if (data) {
          jsonInput.value = JSON.stringify(data, null, 2);
        }
      });

      minifyBtn.addEventListener('click', () => {
        const data = parseJSON();
        if (data) {
          jsonInput.value = JSON.stringify(data);
        }
      });

      searchInput.addEventListener('input', () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          if (parsedData) buildTree(parsedData, searchInput.value.trim());
        }, 150);
      });

      parsedData = parseJSON();
      if (parsedData) {
        updateStats(parsedData);
        buildTree(parsedData);
      }
    })();
  </script>
</body>
</html>
