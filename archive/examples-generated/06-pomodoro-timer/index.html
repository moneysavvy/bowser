<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #0f0f23;
      --bg-gradient-mid: #1a1a3e;
      --bg-gradient-end: #0d0d1f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .header { text-align: center; margin-bottom: 2rem; animation: fadeSlideDown 0.6s ease-out; }
    .header h1 {
      font-size: 2.5rem; font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -0.02em;
    }
    .header p { color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.95rem; }

    .badge {
      display: inline-block; margin-top: 0.75rem; padding: 0.25rem 0.75rem;
      background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px; font-size: 0.75rem; color: #a5b4fc;
    }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      backdrop-filter: blur(12px); overflow: hidden;
      animation: fadeSlideUp 0.5s ease-out 0.2s both;
    }

    .btn {
      padding: 0.875rem 1.5rem; border: none; border-radius: var(--radius-sm);
      color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: var(--transition); white-space: nowrap; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #4f46e5); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--accent-hover), #6366f1); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .btn-ghost.active { background: var(--accent); border-color: var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }

    .input {
      flex: 1; padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 1rem; font-family: inherit; transition: var(--transition);
    }
    .input::placeholder { color: var(--text-muted); }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .row { display: flex; gap: 0.75rem; padding: 1.25rem; }
    .row-border { border-bottom: 1px solid var(--card-border); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 1.25rem;
      transition: var(--transition);
    }
    .stat-card:hover { border-color: rgba(99, 102, 241, 0.3); transform: translateY(-2px); }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

    .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }

    @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    @media (max-width: 640px) {
      .header h1 { font-size: 1.75rem; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .row { padding: 1rem; }
    }

    .timer-container{display:flex;flex-direction:column;align-items:center;padding:3rem 2rem}.progress-ring{position:relative;width:280px;height:280px}.progress-ring svg{transform:rotate(-90deg);width:100%;height:100%}.progress-ring circle{fill:none;stroke-width:8;stroke-linecap:round}.progress-ring .bg{stroke:var(--card-border)}.progress-ring .progress{stroke:var(--accent);transition:stroke-dashoffset 0.5s ease}.progress-ring .timer-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.timer-display .time{font-size:3.5rem;font-weight:700;letter-spacing:-0.02em}.timer-display .label{font-size:0.9rem;color:var(--text-secondary);margin-top:0.25rem;text-transform:uppercase;letter-spacing:0.1em}.controls{display:flex;gap:0.75rem;margin-top:2rem}.session-info{display:flex;justify-content:center;gap:2rem;margin-top:2rem}.session-stat{text-align:center}.session-stat .value{font-size:1.5rem;font-weight:700;color:var(--accent)}.session-stat .label{font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem}
  </style>
</head>
<body>
  <div id="app">
    <div class="header"><h1>Pomodoro Timer</h1><p>Stay focused. Take breaks.</p></div><div class="card timer-container"><div class="progress-ring"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle class="progress" cx="100" cy="100" r="90"/></svg><div class="timer-display"><div class="time">25:00</div><div class="label">Work</div></div></div><div class="controls"><button class="btn btn-primary" id="startBtn">Start</button><button class="btn btn-ghost" id="pauseBtn" style="display:none">Pause</button><button class="btn btn-ghost" id="resetBtn">Reset</button></div><div class="session-info"><div class="session-stat"><div class="value" id="sessionCount">0</div><div class="label">Sessions</div></div><div class="session-stat"><div class="value" id="currentType">Work</div><div class="label">Current</div></div></div></div>
  </div>
  <script>
    const DURATIONS={work:25*60,shortBreak:5*60,longBreak:15*60};const circumference=2*Math.PI*90;let currentType='work';let timeLeft=DURATIONS.work;let isRunning=false;let interval=null;let sessions=parseInt(localStorage.getItem('pomodoroSessions'))||0;const progress=document.querySelector('.progress');const timeDisplay=document.querySelector('.time');const labelDisplay=document.querySelector('.label');const startBtn=document.getElementById('startBtn');const pauseBtn=document.getElementById('pauseBtn');const resetBtn=document.getElementById('resetBtn');const sessionCountEl=document.getElementById('sessionCount');const currentTypeEl=document.getElementById('currentType');progress.style.strokeDasharray=circumference;function updateDisplay(){const mins=Math.floor(timeLeft/60);const secs=timeLeft%60;timeDisplay.textContent=`${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;const total=DURATIONS[currentType];const progressVal=timeLeft/total;progress.style.strokeDashoffset=circumference*(1-progressVal)}function playBeep(){const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;osc.type='sine';gain.gain.setValueAtTime(0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);osc.start();osc.stop(ctx.currentTime+0.5)}function nextSession(){playBeep();if(currentType==='work'){sessions++;localStorage.setItem('pomodoroSessions',sessions);sessionCountEl.textContent=sessions;currentType=sessions%4===0?'longBreak':'shortBreak'}else{currentType='work'}timeLeft=DURATIONS[currentType];labelDisplay.textContent=currentType==='work'?'Work':currentType==='shortBreak'?'Break':'Long Break';currentTypeEl.textContent=currentType==='work'?'Work':currentType==='shortBreak'?'Break':'Long Break';updateDisplay()}function startTimer(){if(isRunning)return;isRunning=true;startBtn.style.display='none';pauseBtn.style.display='inline-block';interval=setInterval(()=>{timeLeft--;updateDisplay();if(timeLeft<=0){clearInterval(interval);nextSession();isRunning=false;startBtn.style.display='inline-block';pauseBtn.style.display='none';}},1000)}function pauseTimer(){if(!isRunning)return;isRunning=false;clearInterval(interval);startBtn.style.display='inline-block';pauseBtn.style.display='none'}function resetTimer(){pauseTimer();timeLeft=DURATIONS[currentType];updateDisplay()}startBtn.addEventListener('click',startTimer);pauseBtn.addEventListener('click',pauseTimer);resetBtn.addEventListener('click',resetTimer);sessionCountEl.textContent=sessions;currentTypeEl.textContent='Work';updateDisplay();
  </script>
</body>
</html>
