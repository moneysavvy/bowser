<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #0f0f23;
      --bg-gradient-mid: #1a1a3e;
      --bg-gradient-end: #0d0d1f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .header { text-align: center; margin-bottom: 2rem; animation: fadeSlideDown 0.6s ease-out; }
    .header h1 {
      font-size: 2.5rem; font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -0.02em;
    }
    .header p { color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.95rem; }

    .badge {
      display: inline-block; margin-top: 0.75rem; padding: 0.25rem 0.75rem;
      background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px; font-size: 0.75rem; color: #a5b4fc;
    }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      backdrop-filter: blur(12px); overflow: hidden;
      animation: fadeSlideUp 0.5s ease-out 0.2s both;
    }

    .btn {
      padding: 0.875rem 1.5rem; border: none; border-radius: var(--radius-sm);
      color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: var(--transition); white-space: nowrap; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #4f46e5); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--accent-hover), #6366f1); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-ghost { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .btn-ghost.active { background: var(--accent); border-color: var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }

    .input {
      flex: 1; padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 1rem; font-family: inherit; transition: var(--transition);
    }
    .input::placeholder { color: var(--text-muted); }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .row { display: flex; gap: 0.75rem; padding: 1.25rem; }
    .row-border { border-bottom: 1px solid var(--card-border); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 1.25rem;
      transition: var(--transition);
    }
    .stat-card:hover { border-color: rgba(99, 102, 241, 0.3); transform: translateY(-2px); }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

    .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }

    @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    @media (max-width: 640px) {
      .header h1 { font-size: 1.75rem; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .row { padding: 1rem; }
    }

    .expense-form{display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1.5rem}.expense-form .row{display:flex;gap:0.75rem}.expense-form select{padding:0.875rem 1rem;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:1rem;font-family:inherit;transition:var(--transition);flex:1}.expense-form select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}.summary-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:1.25rem;text-align:center;transition:var(--transition)}.summary-card:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-2px)}.summary-card h3{font-size:0.7rem;color:var(--text-muted);margin:0 0 0.5rem;text-transform:uppercase;letter-spacing:0.5px}.summary-card .amount{font-size:1.5rem;font-weight:700}.summary-card.income .amount{color:var(--success)}.summary-card.expense .amount{color:var(--danger)}.summary-card.balance .amount{color:var(--accent)}.filters{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem}.filter-btn{padding:0.5rem 1rem;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);border-radius:999px;cursor:pointer;font-size:0.8rem;color:var(--text-secondary);transition:var(--transition)}.filter-btn:hover{background:rgba(255,255,255,0.1)}.filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--text-primary)}.transactions{list-style:none;padding:0;margin:0}.transaction{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-sm);margin-bottom:0.5rem;transition:var(--transition)}.transaction:hover{border-color:rgba(99,102,241,0.3)}.transaction-info{display:flex;flex-direction:column;gap:0.25rem;flex:1}.transaction-desc{font-weight:500;color:var(--text-primary)}.transaction-meta{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--text-muted)}.category-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.category-dot.food{background:#22c55e}.category-dot.transport{background:#3b82f6}.category-dot.shopping{background:#a855f7}.category-dot.bills{background:#f59e0b}.category-dot.other{background:#6b7280}.transaction-amount{font-weight:600;font-size:1rem;margin-right:0.75rem}.transaction-amount.income{color:var(--success)}.transaction-amount.expense{color:var(--danger)}.delete-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.25rem;padding:0.25rem 0.5rem;border-radius:var(--radius-sm);transition:var(--transition)}.delete-btn:hover{background:var(--danger);color:var(--text-primary)}.empty-state{text-align:center;padding:2rem;color:var(--text-muted)}
  </style>
</head>
<body>
  <div id="app">
    <div class="header"><h1>Expense Tracker</h1><p>Track your spending with ease</p></div><form class="expense-form card"> <div class="row"> <input type="text" class="input" id="desc" placeholder="Description" required> <input type="number" class="input" id="amount" placeholder="Amount" step="0.01" min="0.01" required> </div> <div class="row"> <select class="input" id="category" required> <option value="">Select Category</option> <option value="Food">Food</option> <option value="Transport">Transport</option> <option value="Shopping">Shopping</option> <option value="Bills">Bills</option> <option value="Other">Other</option> </select> <button type="submit" class="btn btn-primary">Add Expense</button> </div></form><div class="summary-cards"> <div class="summary-card income"> <h3>Income</h3> <div class="amount" id="totalIncome">$0.00</div> </div> <div class="summary-card expense"> <h3>Expenses</h3> <div class="amount" id="totalExpense">$0.00</div> </div> <div class="summary-card balance"> <h3>Balance</h3> <div class="amount" id="balance">$0.00</div> </div></div><div class="filters"> <button class="filter-btn active" data-filter="all">All</button> <button class="filter-btn" data-filter="Food">Food</button> <button class="filter-btn" data-filter="Transport">Transport</button> <button class="filter-btn" data-filter="Shopping">Shopping</button> <button class="filter-btn" data-filter="Bills">Bills</button> <button class="filter-btn" data-filter="Other">Other</button></div><ul class="transactions" id="transactions"></ul>
  </div>
  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');let currentFilter = 'all';const descInput = document.getElementById('desc');const amountInput = document.getElementById('amount');const categoryInput = document.getElementById('category');const transactionsList = document.getElementById('transactions');const filterBtns = document.querySelectorAll('.filter-btn');function save(){localStorage.setItem('transactions',JSON.stringify(transactions));}function formatAmount(amt){return '$'+parseFloat(amt).toFixed(2);}function getCategoryDot(cat){return 'category-dot '+cat.toLowerCase();}function render(){const filtered=currentFilter==='all'?transactions:transactions.filter(t=>t.category===currentFilter);let income=0,expense=0;transactions.forEach(t=>{if(t.type==='income')income+=parseFloat(t.amount);else expense+=parseFloat(t.amount);});document.getElementById('totalIncome').textContent=formatAmount(income);document.getElementById('totalExpense').textContent=formatAmount(expense);document.getElementById('balance').textContent=formatAmount(income-expense);if(filtered.length===0){transactionsList.innerHTML='<li class="empty-state">No transactions yet</li>';return;}transactionsList.innerHTML=filtered.map((t,i)=>`<li class="transaction"> <div class="transaction-info"> <span class="transaction-desc">${t.description}</span> <span class="transaction-meta"><span class="${getCategoryDot(t.category)}"></span>${t.category} · ${t.date}</span> </div> <span class="transaction-amount ${t.type}">${t.type==='income'?'+':'-'}${formatAmount(t.amount)}</span> <button class="delete-btn" onclick="deleteTrans(${transactions.indexOf(t)})">&times;</button> </li>`).join('');}window.deleteTrans=function(idx){transactions.splice(idx,1);save();render();};document.querySelector('.expense-form').addEventListener('submit',function(e){e.preventDefault();const amount=parseFloat(amountInput.value);const type=amount>0?'income':'expense';transactions.unshift({description:descInput.value,amount:Math.abs(amount),category:categoryInput.value,type:type,date:new Date().toLocaleDateString()});save();render();this.reset();});filterBtns.forEach(btn=>{btn.addEventListener('click',function(){filterBtns.forEach(b=>b.classList.remove('active'));this.classList.add('active');currentFilter=this.dataset.filter;render();});});render();
  </script>
</body>
</html>
